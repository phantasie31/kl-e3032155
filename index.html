fetch('https://open.er-api.com/v6/latest/THB').then(r=>r.json()).then(j=>{if(j.rates){R={rates:{THB:1,EUR:j.rates.EUR,GBP:j.rates.GBP,USD:j.rates.USD},date:(j.time_last_update_utc||'').slice(5,16)};localStorage.kl_rates=JSON.stringify(R);ui()}}).catch(()=>{});
const SYM={THB:'฿',EUR:'€',GBP:'£',USD:'$'};
const fmt=n=>n?Math.round(n*R.rates[cur]).toLocaleString('fr-FR')+' '+SYM[cur]:'–';
const rateTxt=()=>cur=='THB'?'':`<div class="small">${t('rates')} 1 THB = ${R.rates[cur]} ${cur} · ${R.date||t('fixed')}</div>`;
// ---- calculs ----
const total=p=>p.total||(p.ppr&&p.m2?p.ppr*p.m2/RAI:0);
const rentM=p=>p.rentm||(p.rpr&&p.m2?p.rpr*p.m2/RAI:0);
const ppr=p=>p.ppr||(p.total&&p.m2?p.total/(p.m2/RAI):0);
const hasSale=p=>!!total(p),hasRent=p=>!!rentM(p);
// ---- carte ----
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
const lbl=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'});
const map=L.map('map',{zoomControl:false}).setView([7.5580823,99.0418362],15);sat.addTo(map);lbl.addTo(map);
let street=0;lay.onclick=()=>{street=!street;if(street){map.removeLayer(sat);map.removeLayer(lbl);osm.addTo(map)}else{map.removeLayer(osm);sat.addTo(map);lbl.addTo(map)}};
const col=s=>s=='vendu'?'#e74c3c':s=='reserve'?'#f39c12':'#2ecc71';
let G=L.layerGroup().addTo(map);
function draw(){G.clearLayers();D.forEach(p=>{L.polygon(p.coords,{color:col(p.status),fillColor:col(p.status),fillOpacity:.5,weight:2}).addTo(G).on('click',()=>card(p.id))})}
const P=document.getElementById('P');const open=(h,full)=>{P.innerHTML=h;P.className='panel'+(full?' full':'');P.style.display='block';P.scrollTop=0};const close=()=>P.style.display='none';
const yn=v=>v=='oui'?t('yes'):v=='non'?t('no'):'';
const stT=s=>s=='vendu'?t('sold'):s=='reserve'?t('res'):t('av');
function card(id){const p=D.find(x=>x.id==id);const r=(k,v,c)=>v?`<div class="row ${c||''}"><span>${k}</span><span>${v}</span></div>`:'';
const ty=hasSale(p)&&hasRent(p)?'both':hasRent(p)?'location':'vente';
open(`<h3>${p.name} ${p.ex?'<span class="ex">'+t('ex')+'</span>':''}</h3>
${r(t('status'),`<b style="color:${col(p.status)}">${stT(p.status)}</b>`)}${r(t('type'),t(ty))}${r(t('area'),areaTxt(p.m2),'big')}
${hasSale(p)?r(t('ppu')+' '+uname(),fmt(perU(ppr(p))))+r(t('total'),fmt(total(p)),'big'):''}
${hasRent(p)?r(t('rpu')+' '+uname(),p.rpr&&fmt(perU(p.rpr)))+r(t('rentm'),fmt(rentM(p)),'big')+r(t('renty'),fmt(rentM(p)*12))+r(t('inc'),p.inc&&(p.inc+' % / '+(p.every||'?')+' '+t('yrs')))+r(t('lease'),p.lease&&p.lease+' '+t('yrs')):''}
${r(t('sea'),yn(p.sea))}${r(t('dist'),p.dist&&p.dist+' m')}${r(t('road'),yn(p.road))}${r(t('access'),p.access)}${r(t('util'),p.util)}${r(t('contact'),p.contact)}${r(t('notes'),p.notes)}${rateTxt()}
<div class="photos">${(p.photos||[]).map(s=>`<img src="${s}">`).join('')}</div>
<div class="btns"><button class="r" onclick="st('${id}','vendu')">${t('sold')}</button><button class="o" onclick="st('${id}','reserve')">${t('res')}</button><button class="g" onclick="st('${id}','dispo')">${t('av')}</button></div>
<div class="btns"><button onclick="form('${id}')">${t('edit')}</button><button onclick="delp('${id}')">${t('del')}</button><button onclick="close()">${t('close')}</button></div>`)}
function st(id,s){D.find(x=>x.id==id).status=s;save();draw();card(id)}
function delp(id){if(confirm(t('conf'))){D=D.filter(x=>x.id!=id);save();draw();close()}}
let tmp=null;
function form(id,coords){const p=id?D.find(x=>x.id==id):{coords,m2:Math.round(area(coords)),status:'dispo'};tmp={...p,photos:[...(p.photos||[])]};
const v=x=>x?Math.round(x*100)/100:'';const au=unit=='rnw'?'rai':uname();const aU=unit=='rnw'?RAI:U[unit];
const sel=(k,o)=>`<label>${t(k)}<select id="f_${k}">${o.map(x=>`<option value="${x}" ${p[k]==x?'selected':''}>${yn(x)||'–'}</option>`).join('')}</select></label>`;
const inp=(id,lab,val,ty='number')=>`<label>${lab}<input id="${id}" type="${ty}" value="${val??''}"></label>`;
open(`<h3>${id?t('edit'):t('add')}</h3>${inp('f_name',t('name'),p.name,'text')}${inp('f_area',t('area')+' ('+au+')',v(p.m2/aU))}
<fieldset><legend>${t('sale')}</legend><div class="small">${t('inTHB')} · ${t('blank')}</div>${inp('f_ppu',t('ppu')+' '+au+' (THB)',v(ppr(p)*aU/RAI))}${inp('f_total',t('total')+' (THB)',v(total(p)))}</fieldset>
<fieldset><legend>${t('rent')}</legend>${inp('f_rpu',t('rpu')+' '+au+' (THB)',v((p.rpr||(rentM(p)&&p.m2?rentM(p)/(p.m2/RAI):0))*aU/RAI))}${inp('f_rentm',t('rentm')+' (THB)',v(rentM(p)))}${inp('f_renty',t('renty')+' (THB)',v(rentM(p)*12))}${inp('f_inc',t('inc'),p.inc)}${inp('f_every',t('every'),p.every)}${inp('f_lease',t('lease'),p.lease)}</fieldset>
${sel('sea',['','oui','non'])}${inp('f_dist',t('dist'),p.dist)}${sel('road',['','oui','non'])}${inp('f_access',t('access'),p.access,'text')}${inp('f_util',t('util'),p.util,'text')}${inp('f_contact',t('contact'),p.contact,'text')}<label>${t('notes')}<textarea id="f_notes">${p.notes||''}</textarea></label>
<label>${t('photos')}<input type="file" accept="image/*" multiple onchange="addPh(this.files)"></label><div class="photos" id="ph"></div>
<div class="btns"><button class="g" onclick="sv()">${t('save')}</button><button onclick="close()">${t('cancel')}</button></div>`,1);showPh();
const A=()=>+f_area.value||0;
f_ppu.oninput=f_area.oninput=()=>{if(f_ppu.value)f_total.value=Math.round(f_ppu.value*A());if(f_rpu.value){f_rentm.value=Math.round(f_rpu.value*A());f_renty.value=f_rentm.value*12}};
f_total.oninput=()=>{if(A())f_ppu.value=Math.round(f_total.value/A())};
f_rpu.oninput=()=>{f_rentm.value=Math.round(f_rpu.value*A());f_renty.value=f_rentm.value*12};
f_rentm.oninput=()=>{f_renty.value=f_rentm.value*12;if(A())f_rpu.value=Math.round(f_rentm.value/A())};
f_renty.oninput=()=>{f_rentm.value=Math.round(f_renty.value/12);if(A())f_rpu.value=Math.round(f_rentm.value/A())}}
function showPh(){ph.innerHTML=tmp.photos.map((s,i)=>`<img src="${s}" onclick="tmp.photos.splice(${i},1);showPh()">`).join('')}
function addPh(fs){[...fs].forEach(f=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp.photos.push(c.toDataURL('image/jpeg',.6));showPh()};im.src=URL.createObjectURL(f)})}
function sv(){const n=x=>x===''?0:+x;const aU=unit=='rnw'?RAI:U[unit];
tmp.name=f_name.value;tmp.m2=n(f_area.value)*aU;tmp.total=n(f_total.value);tmp.ppr=tmp.m2?tmp.total/(tmp.m2/RAI):0;
tmp.rentm=n(f_rentm.value);tmp.rpr=tmp.m2?tmp.rentm/(tmp.m2/RAI):0;tmp.inc=n(f_inc.value);tmp.every=n(f_every.value);tmp.lease=n(f_lease.value);
tmp.sea=f_sea.value;tmp.road=f_road.value;tmp.dist=n(f_dist.value);['access','util','contact','notes'].forEach(k=>tmp[k]=document.getElementById('f_'+k).value);
if(!tmp.id){tmp.id='p'+Date.now();D.push(tmp)}else D[D.findIndex(x=>x.id==tmp.id)]=tmp;try{save()}catch(e){alert('Stockage plein / storage full')}draw();card(tmp.id)}
function area(c){const R=6378137,r=Math.PI/180;let a=0;for(let i=0;i<c.length;i++){const[p1,l1]=c[i],[p2,l2]=c[(i+1)%c.length];a+=(l2-l1)*r*(2+Math.sin(p1*r)+Math.sin(p2*r))}return Math.abs(a*R*R/2)}
add.onclick=()=>{close();hint.textContent=t('draw');hint.style.display='block';map.pm.enableDraw('Polygon',{snappable:false})};
map.on('pm:create',e=>{hint.style.display='none';const c=e.layer.getLatLngs()[0].map(l=>[+l.lat.toFixed(6),+l.lng.toFixed(6)]);map.removeLayer(e.layer);form(null,c)});
// ---- liste ----
let flt={type:'',avail:0,sea:0,road:0,max:'',sort:'total'};
function list(){const v=D.filter(p=>(!flt.type||(flt.type=='vente'?hasSale(p):hasRent(p)))&&(!flt.avail||p.status=='dispo')&&(!flt.sea||p.sea=='oui')&&(!flt.road||p.road=='oui')&&(!flt.max||(total(p)&&total(p)<=flt.max)));
const key={total:p=>total(p)||1e15,ppu:p=>ppr(p)||1e15,rentm:p=>rentM(p)||1e15,area:p=>-(p.m2||0)}[flt.sort];v.sort((a,b)=>key(a)-key(b));
const o=(k,l)=>`<option value="${k}" ${flt.sort==k?'selected':''}>${l}</option>`;const cb=(k,l)=>`<label><input type="checkbox" style="width:auto" ${flt[k]?'checked':''} onchange="flt.${k}=this.checked;list()"> ${l}</label>`;
open(`<h3>${t('list')} (${v.length})</h3><select onchange="flt.type=this.value;list()"><option value="">${t('all')}</option><option value="vente" ${flt.type=='vente'?'selected':''}>${t('vente')}</option><option value="location" ${flt.type=='location'?'selected':''}>${t('location')}</option></select>
${cb('avail',t('availOnly'))}${cb('sea',t('sea'))}${cb('road',t('road'))}
<label>${t('maxp')}<input type="number" value="${flt.max}" onchange="flt.max=+this.value||'';list()"></label><label>${t('sort')}<select onchange="flt.sort=this.value;list()">${o('total',t('total'))}${o('ppu',t('ppu')+' '+uname())}${o('rentm',t('rentm'))}${o('area',t('area')+' ↓')}</select></label>${rateTxt()}
${v.map(p=>`<div class="card" onclick="goto('${p.id}')"><b style="color:${col(p.status)}">●</b> <b>${p.name}</b> ${p.ex?'<span class="ex">'+t('ex')+'</span>':''}<br>${areaTxt(p.m2)}${hasSale(p)?` · <b>${fmt(total(p))}</b> (${fmt(perU(ppr(p)))}/${uname()})`:''}${hasRent(p)?` · ${fmt(rentM(p))}/m`:''} ${p.sea=='oui'?'🌊':''}${p.road=='oui'?'🛣️':''}</div>`).join('')||t('none')}
<div class="btns"><button onclick="close()">${t('close')}</button></div>`,1)}
function goto(id){const p=D.find(x=>x.id==id);map.fitBounds(p.coords,{maxZoom:17,paddingBottomRight:[0,300]});card(id)}
lst.onclick=list;
more.onclick=()=>open(`<div class="btns"><button onclick="exp()">${t('exp')}</button><button onclick="imp.click()">${t('impt')}</button></div><div class="btns"><button onclick="kml.click()">${t('kml')}</button></div><div class="btns"><button onclick="if(confirm('?')){D=D.filter(p=>!p.ex).concat(DEMO);save();draw();close()}">${t('reset')}</button><button onclick="close()">${t('close')}</button></div>`);
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='terrains_koh_lanta_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
imp.onchange=e=>{const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();draw();close()}catch(x){alert('JSON ?')}};r.readAsText(e.target.files[0])};
// Import KML/KMZ/GeoJSON (export de l'appli GPS) -> chaque polygone devient un terrain à compléter
kml.onchange=async e=>{const f=e.target.files[0];if(!f)return;let polys=[];try{
 if(/\.kmz$/i.test(f.name)){const z=await JSZip.loadAsync(f);const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));polys=parseKML(await z.file(k).async('string'))}
 else{const txt=await f.text();polys=/^\s*</.test(txt)?parseKML(txt):parseGJ(JSON.parse(txt))}
}catch(x){alert('Fichier illisible / unreadable');return}
polys.forEach((p,i)=>D.push({id:'k'+Date.now()+i,name:p.name||('Import '+(i+1)),status:'dispo',m2:Math.round(area(p.coords)),coords:p.coords,notes:p.desc||''}));
save();draw();close();alert(t('kmlok')+polys.length);if(polys.length)map.fitBounds(polys.flatMap(p=>p.coords))};
function parseKML(x){const d=new DOMParser().parseFromString(x,'text/xml');const out=[];[...d.getElementsByTagName('Placemark')].forEach(pm=>{const nm=pm.getElementsByTagName('name')[0],ds=pm.getElementsByTagName('description')[0];
 [...pm.getElementsByTagName('Polygon')].forEach(pg=>{const c=pg.getElementsByTagName('coordinates')[0];if(!c)return;const coords=c.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length>1&&!isNaN(a[1])).map(a=>[a[1],a[0]]);if(coords.length>2)out.push({name:nm&&nm.textContent.trim(),desc:ds&&ds.textContent.replace(/<[^>]+>/g,' ').trim(),coords})})});return out}
function parseGJ(g){const out=[];const fs=g.type=='FeatureCollection'?g.features:[g.type=='Feature'?g:{geometry:g,properties:{}}];fs.forEach(f=>{const gm=f.geometry||{},pr=f.properties||{};const rings=gm.type=='Polygon'?[gm.coordinates[0]]:gm.type=='MultiPolygon'?gm.coordinates.map(p=>p[0]):[];rings.forEach(r=>out.push({name:pr.name||pr.Name,coords:r.map(a=>[a[1],a[0]])}))});return out}
unitSel.onchange=()=>{unit=unitSel.value;localStorage.kl_unit=unit;ui();close()};
curSel.onchange=()=>{cur=curSel.value;localStorage.kl_cur=cur;ui();close()};
function ui(){add.textContent=t('add');lst.textContent=t('list');lng.textContent={fr:'EN',en:'ไทย',th:'FR'}[lang];draw()}
lng.onclick=()=>{lang={fr:'en',en:'th',th:'fr'}[lang];localStorage.kl_lang=lang;ui();close()};ui();
</script></body></html>
