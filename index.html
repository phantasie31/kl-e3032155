<style>
:root{--g:#0b6e4f;--ink:#1d2b26;--mut:#6b7a74;--line:#e9eeec;--bg:#f6f8f7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",system-ui,sans-serif;font-size:14px;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
#bar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--g);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:1000;box-shadow:0 2px 8px #0003}
#bar b{flex:1;font-size:16px;white-space:nowrap;letter-spacing:.2px}
#bar button{border:0;border-radius:8px;padding:7px 9px;font-size:14px;background:#ffffff22;color:#fff;font-weight:600}
#bar select{width:auto;margin:0;padding:6px 4px;font-size:13px;border-radius:8px;border:0;background:#ffffff22;color:#fff;font-weight:600}#bar option{color:#000}
#map{position:fixed;top:52px;bottom:0;left:0;right:0}
#foot{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;z-index:1000;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0003}
#foot button{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;background:var(--g);color:#fff;white-space:nowrap}
#foot button#more{background:var(--bg);color:var(--ink)}
/* ---- panneau compact ---- */
.panel{position:fixed;top:64px;right:12px;width:360px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;z-index:2000;border-radius:16px;box-shadow:0 10px 34px #0003,0 2px 6px #0001;display:none;overscroll-behavior:contain}
.ph{position:sticky;top:0;background:#fff;z-index:2;padding:14px 46px 10px 16px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:17px;line-height:1.25}
.x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);font-size:18px;line-height:30px;padding:0;color:var(--ink)}
.x:hover{background:#e3e9e6}
.pb{padding:12px 16px 16px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:6px;margin-right:4px}
.b-dispo{background:#e5f7ed;color:#178a4c}.b-reserve{background:#fff1dc;color:#b86e00}.b-vendu{background:#fde7e5;color:#c0392b}
.ex{background:#fff6c2;color:#7a6400}
.thumb{height:120px;border-radius:12px;background:linear-gradient(135deg,#bfe6d6,#8ccfe0);display:flex;align-items:center;justify-content:center;color:#2b5c4e;font-size:13px;overflow:hidden;gap:4px}
.thumb img{height:100%;flex:1;min-width:0;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px}
.area{margin:10px 0 0;font-size:13px;color:var(--mut)}.area b{color:var(--ink);font-size:15px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:12px 0 10px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--mut);font-size:14px}
.tabs button.on{background:#fff;color:var(--g);box-shadow:0 1px 4px #0002}
.tabs.one button{cursor:default}
.hero{font-size:26px;font-weight:800;color:var(--g);line-height:1.1}.hero small{font-size:14px;font-weight:600;color:var(--mut)}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv:last-child{border:0}
.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
details{margin-top:10px}summary{cursor:pointer;color:var(--g);font-weight:600;font-size:13px;padding:4px 0}
.seg{display:flex;gap:6px;margin-top:12px}.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.s-dispo.on{background:#2ecc71;border-color:#2ecc71;color:#fff}.seg button.s-reserve.on{background:#f39c12;border-color:#f39c12;color:#fff}.seg button.s-vendu.on{background:#e74c3c;border-color:#e74c3c;color:#fff}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.act button.pri{background:var(--g);border-color:var(--g);color:#fff}.act button.dan{color:#c0392b}
.small{font-size:12px;color:var(--mut);margin-top:6px}
/* formulaire */
label{display:block;margin-top:9px;font-size:12.5px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;font-size:14px;border:1px solid #d7dfdb;border-radius:9px;margin-top:3px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #0b6e4f55;border-color:var(--g)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
fieldset{border:1px solid var(--line);border-radius:12px;margin:12px 0 0;padding:4px 12px 12px}legend{font-weight:700;padding:0 6px;color:var(--ink)}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.photos img{height:64px;width:64px;object-fit:cover;border-radius:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:7px 0;cursor:pointer;font-size:13px}.card:hover{background:var(--bg)}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px}.chk label{display:flex;align-items:center;gap:5px;font-weight:500;color:var(--ink)}.chk input{width:auto;margin:0}
#hint{position:fixed;top:62px;left:50%;transform:translateX(-50%);max-width:92vw;background:#000c;color:#fff;padding:9px 14px;border-radius:10px;z-index:1500;display:none;font-size:13.5px}
/* mobile : bottom sheet */
@media (max-width:640px){
 .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:55vh;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0003}
 .panel.tall{max-height:80vh}
 .ph::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:#d5dcd9;margin:-6px auto 8px}
 .thumb{height:64px}.hero{font-size:23px}
 #foot{bottom:14px}#bar b{font-size:14px}
}

const $=i=>document.getElementById(i),A=()=>+$('f_area').value||0;
const rm=()=>{$('f_rm').textContent=$('f_renty').value?`= ${(+Math.round($('f_renty').value/12)).toLocaleString(NL())} ${t('thb')} ${t('permonth')}`:''};rm();
$('f_ppu').oninput=()=>{if($('f_ppu').value)$('f_total').value=Math.round($('f_ppu').value*A())};
$('f_area').oninput=()=>{if($('f_ppu').value)$('f_total').value=Math.round($('f_ppu').value*A());if($('f_rpu').value){$('f_renty').value=Math.round($('f_rpu').value*A());rm()}};
$('f_total').oninput=()=>{if(A())$('f_ppu').value=Math.round($('f_total').value/A())};
$('f_rpu').oninput=()=>{$('f_renty').value=Math.round($('f_rpu').value*A());rm()};
$('f_renty').oninput=()=>{if(A())$('f_rpu').value=Math.round($('f_renty').value/A());rm()};
$('f_ph').onchange=e=>addPh(e.target.files)}
function showPh(){const ph=document.getElementById('ph');ph.innerHTML=tmp.photos.map((s,i)=>`<img src="${s}" title="✕" onclick="KL.rmPh(${i})">`).join('')}
function addPh(fs){[...fs].forEach(f=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp.photos.push(c.toDataURL('image/jpeg',.6));showPh()};im.src=URL.createObjectURL(f)})}
function sv(){const $=i=>document.getElementById(i).value,n=x=>x===''?0:+x;const aU=unit=='rnw'?RAI:U[unit];
{const nv=$('f_name');tmp.name=nv===pname(tmp)?tmp.name:(nv||t('newp'))}tmp.m2=n($('f_area'))*aU;tmp.status=$('f_status');tmp.total=n($('f_total'));tmp.ppr=tmp.m2?tmp.total/(tmp.m2/RAI):0;
tmp.renty=n($('f_renty'));delete tmp.rentm;delete tmp.rpr;tmp.inc=n($('f_inc'));tmp.every=n($('f_every'));tmp.lease=n($('f_lease'));
tmp.sea=$('f_sea');tmp.road=$('f_road');tmp.dist=n($('f_dist'));['access','util','contact','notes'].forEach(k=>{const nv=$('f_'+k);if(nv!==dv(tmp[k]))tmp[k]=nv});
if(!tmp.id){tmp.id='p'+Date.now();D.push(tmp)}else D[D.findIndex(x=>x.id==tmp.id)]=tmp;try{save()}catch(e){alert(t('full'))}draw();card(tmp.id)}
function area(c){const R=6378137,r=Math.PI/180;let a=0;for(let i=0;i<c.length;i++){const[p1,l1]=c[i],[p2,l2]=c[(i+1)%c.length];a+=(l2-l1)*r*(2+Math.sin(p1*r)+Math.sin(p2*r))}return Math.abs(a*R*R/2)}
add.onclick=()=>{closeP();hint.textContent=t('draw');hint.style.display='block';map.pm.enableDraw('Polygon',{snappable:false})};
map.on('pm:create',e=>{hint.style.display='none';const c=e.layer.getLatLngs()[0].map(l=>[+l.lat.toFixed(6),+l.lng.toFixed(6)]);map.removeLayer(e.layer);form(null,c)});
// ---- liste ----
let flt={type:'',avail:0,sea:0,road:0,max:'',sort:'total'};
function list(){const v=D.filter(p=>(!flt.type||(flt.type=='vente'?hasSale(p):hasRent(p)))&&(!flt.avail||p.status=='dispo')&&(!flt.sea||p.sea=='oui')&&(!flt.road||p.road=='oui')&&(!flt.max||(total(p)&&total(p)<=flt.max)));
const key={total:p=>total(p)||1e15,ppu:p=>ppr(p)||1e15,renty:p=>rentY(p)||1e15,area:p=>-(p.m2||0)}[flt.sort];v.sort((a,b)=>key(a)-key(b));
const o=(k,l)=>`<option value="${k}" ${flt.sort==k?'selected':''}>${l}</option>`;const cb=(k,l)=>`<label><input type="checkbox" ${flt[k]?'checked':''} onchange="KL.flt('${k}',this.checked)"> ${l}</label>`;
openP(`<h3>${t('list')} (${v.length})</h3>`,`<div class="grid2"><label>${t('type')}<select onchange="KL.flt('type',this.value)"><option value="">${t('all')}</option><option value="vente" ${flt.type=='vente'?'selected':''}>${t('vente')}</option><option value="location" ${flt.type=='location'?'selected':''}>${t('location')}</option></select></label><label>${t('sort')}<select onchange="KL.flt('sort',this.value)">${o('total',t('total'))}${o('ppu',t('ppu')+' '+uname())}${o('renty',t('renty'))}${o('area',t('area')+' ↓')}</select></label></div>
<div class="chk" style="margin-top:6px">${cb('avail',t('availOnly'))}${cb('sea',t('sea'))}${cb('road',t('road'))}</div>
<label>${t('maxp')}<input type="number" value="${flt.max}" onchange="KL.flt('max',+this.value||'')"></label>${rateTxt()}
${v.map(p=>`<div class="card" onclick="KL.go('${p.id}')"><b style="color:${col(p.status)}">●</b> <b>${esc(pname(p))}</b> ${p.ex?`<span class="badge ex" style="margin:0">${t('ex')}</span>`:''}<br><span style="color:var(--mut)">${areaTxt(p.m2)}${p.sea=='oui'?' · 🌊':''}${p.road=='oui'?' · 🛣️':''}</span><br>${hasSale(p)?`💰 <b>${fmt(total(p))}</b> `:''}${hasRent(p)?`🔑 <b>${fmt(rentY(p))}</b>${t('peryear')}`:''}</div>`).join('')||t('none')}`,1)}
function goto(id){const p=D.find(x=>x.id==id);map.fitBounds(p.coords,{maxZoom:17,paddingTopLeft:[20,20],paddingBottomRight:mob()?[20,innerHeight*.55]:[400,20]});card(id)}
function menu(){openP(`<h3>${t('menu')}</h3>`,`<div class="act"><button onclick="KL.exp()">${t('exp')}</button><button onclick="KL.imp()">${t('impt')}</button></div><div class="act"><button onclick="KL.kml()">${t('kml')}</button></div><div class="act"><button class="dan" onclick="KL.reset()">${t('reset')}</button></div>`)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='terrains_koh_lanta_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
imp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;D=migrate(j);save();draw();closeP()}catch(x){alert(t('badjson'))}imp.value=''};r.readAsText(f)};
// Import KML/KMZ/GeoJSON (export de l'appli GPS) -> chaque polygone devient un terrain à compléter
kml.onchange=async e=>{const f=e.target.files[0];if(!f)return;let polys=[];try{
 if(/\.kmz$/i.test(f.name)){const z=await JSZip.loadAsync(f);const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));polys=parseKML(await z.file(k).async('string'))}
 else{const txt=await f.text();polys=/^\s*</.test(txt)?parseKML(txt):parseGJ(JSON.parse(txt))}
}catch(x){alert(t('badfile'));return}finally{kml.value=''}
polys.forEach((p,i)=>D.push({id:'k'+Date.now()+i,name:p.name||(t('import_')+' '+(i+1)),status:'dispo',m2:Math.round(area(p.coords)),coords:p.coords,notes:p.desc||''}));
save();draw();closeP();alert(t('kmlok')+polys.length);if(polys.length)map.fitBounds(polys.flatMap(p=>p.coords))};
function parseKML(x){const d=new DOMParser().parseFromString(x,'text/xml');const out=[];[...d.getElementsByTagName('Placemark')].forEach(pm=>{const nm=pm.getElementsByTagName('name')[0],ds=pm.getElementsByTagName('description')[0];
 [...pm.getElementsByTagName('Polygon')].forEach(pg=>{const c=pg.getElementsByTagName('coordinates')[0];if(!c)return;const coords=c.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length>1&&!isNaN(a[1])).map(a=>[a[1],a[0]]);if(coords.length>2)out.push({name:nm&&nm.textContent.trim(),desc:ds&&ds.textContent.replace(/<[^>]+>/g,' ').trim(),coords})})});return out}
function parseGJ(g){const out=[];const fs=g.type=='FeatureCollection'?g.features:[g.type=='Feature'?g:{geometry:g,properties:{}}];fs.forEach(f=>{const gm=f.geometry||{},pr=f.properties||{};const rings=gm.type=='Polygon'?[gm.coordinates[0]]:gm.type=='MultiPolygon'?gm.coordinates.map(p=>p[0]):[];rings.forEach(r=>out.push({name:pr.name||pr.Name,coords:r.map(a=>[a[1],a[0]])}))});return out}

window.KL={card,close:closeP,edit:id=>form(id),save:sv,cancel:()=>tmp&&tmp.id?card(tmp.id):closeP(),del:delp,st,go:goto,
 tab:(id,k)=>{tab[id]=k;card(id)},rmPh:i=>{tmp.photos.splice(i,1);showPh()},flt:(k,v)=>{flt[k]=v;list()},
 exp,imp:()=>imp.click(),kml:()=>kml.click(),reset:()=>{if(confirm(t('resetq'))){D=D.filter(p=>!p.ex).concat(DEMO);save();draw();closeP()}}};
